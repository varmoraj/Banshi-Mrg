<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>Digital Kankotri</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body{font-family:sans-serif;background:#f1f5f9;padding:20px}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.box{background:white;padding:15px;border-radius:10px}
textarea,input,button{width:100%;padding:8px;margin:5px 0}
button{background:#1e293b;color:white;border:none;border-radius:6px}
.preview{background:#e5ddd5;padding:10px;border-radius:10px}
.bubble{background:#dcf8c6;padding:10px;border-radius:10px;white-space:pre-wrap}
table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{border:1px solid #ddd;padding:6px;font-size:13px}
.sent{background:#dcfce7}
</style>
</head>

<body>

<div class="wrap">

<div class="box">
<h3>Template Editor</h3>
<textarea id="templateBox" rows="12"></textarea>

<input id="dateDay" placeholder="તા. 20-01-2026, મંગળવાર">
<input id="likhtan" placeholder="શ્રી ભગવાનજીભાઈ & શ્રીમતી ભાવનાબેન">
<input id="venue" placeholder="Imperial Party Lawns">
<input id="mapLink" placeholder="https://maps.app.goo.gl/...">

<input type="file" id="excel" accept=".xlsx">
<button onclick="generate()">Generate Guests</button>

<div id="stats"></div>

<table id="table">
<tr><th>#</th><th>Name</th><th>Status</th><th>Send</th></tr>
</table>

</div>

<div class="box">
<h3>WhatsApp Live Preview</h3>
<div class="preview">
<div class="bubble" id="preview"></div>
</div>
</div>

</div>

<script src="app.js"></script>
</body>
</html>
